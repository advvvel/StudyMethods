<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Methods</title>
    <style>
        :root {
            --teal-bg: #e0f2f1;
            --teal-btn: #4db6ac;
            --teal-text: #00796b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--teal-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Black title in the top-left corner */
        .page-title {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            color: #000000;
            font-weight: bold;
            margin: 0;
            z-index: 100;
        }

        /* Large white container */
        .main-card {
            background: white;
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 900px;
            text-align: center;
            margin-top: 40px;
        }

        /* Grid Selection - Now 3 columns for better fit */
        .method-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            margin-top: 10px;
        }

        .method-box {
            background: #ffffff;
            border: 2px solid #f0f0f0;
            border-radius: 25px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            padding: 15px;
        }

        .method-box:hover {
            border-color: var(--teal-btn);
            transform: translateY(-5px);
            background-color: #fafafa;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .label {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--teal-text);
        }

        /* Timer UI */
        #timer-view { display: none; }
        
        #display {
            font-size: 6rem;
            color: var(--teal-text);
            margin: 20px 0;
        }

        .btn {
            background: var(--teal-btn);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 30px;
            color: #888;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <p class="page-title">StudyMethods</p>

    <div class="main-card">
        <div id="selection-view">
            <div class="method-container">
                <div class="method-box" onclick="start(25, 'Pomodoro')">
                    <span class="emoji">🍅</span>
                    <span class="label">Pomodoro</span>
                </div>
                <div class="method-box" onclick="start(10, 'Quick Burst')">
                    <span class="emoji">⚡</span>
                    <span class="label">Quick Burst</span>
                </div>
                <div class="method-box" onclick="start(20, 'Feynman')">
                    <span class="emoji">🧠</span>
                    <span class="label">Feynman</span>
                </div>
                <div class="method-box" onclick="start(15, 'Recall')">
                    <span class="emoji">📖</span>
                    <span class="label">Active Recall</span>
                </div>
                <div class="method-box" onclick="start(5, 'Blurting')">
                    <span class="emoji">📝</span>
                    <span class="label">Blurting</span>
                </div>
                <div class="method-box" onclick="start(45, 'The Frog')">
                    <span class="emoji">🐸</span>
                    <span class="label">Eat the Frog</span>
                </div>
            </div>
        </div>

        <div id="timer-view">
            <h2 id="mode-name" style="color: var(--teal-text)">Method</h2>
            <div id="display">00:00</div>
            <button id="run-btn" class="btn" onclick="toggle()">Start</button>
            <span class="back" onclick="goBack()">← Back to Methods</span>
        </div>
    </div>

    <script>
        let time;
        let timer = null;
        let running = false;

        function start(mins, name) {
            document.getElementById('selection-view').style.display = 'none';
            document.getElementById('timer-view').style.display = 'block';
            document.getElementById('mode-name').innerText = name;
            time = mins * 60;
            showTime();
        }

        function showTime() {
            let m = Math.floor(time / 60);
            let s = time % 60;
            document.getElementById('display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function toggle() {
            if (!running) {
                running = true;
                document.getElementById('run-btn').innerText = "Pause";
                timer = setInterval(() => {
                    time--;
                    showTime();
                    if (time <= 0) {
                        clearInterval(timer);
                        alert("Session finished! Take a break.");
                        goBack();
                    }
                }, 1000);
            } else {
                running = false;
                document.getElementById('run-btn').innerText = "Resume";
                clearInterval(timer);
            }
        }

        function goBack() {
            clearInterval(timer);
            running = false;
            document.getElementById('run-btn').innerText = "Start";
            document.getElementById('selection-view').style.display = 'block';
            document.getElementById('timer-view').style.display = 'none';
        }
    </script>
</body>
</html>
