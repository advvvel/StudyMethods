<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Methods</title>
    <style>
        :root {
            --teal-dark: #00796b;
            --teal-medium: #4db6ac;
            --teal-light: #e0f2f1;
            --text: #2c3e50;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--teal-light);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Title in the top left corner */
        .page-title {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--teal-dark);
            margin: 0;
        }

        .container {
            background: white;
            padding: 60px 40px; /* Bigger padding */
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 121, 107, 0.08);
            width: 100%;
            max-width: 650px; /* Made the white box wider */
            text-align: center;
        }

        /* Square Button Grid */
        .method-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px; /* More space between buttons */
        }

        .square-card {
            background: #ffffff;
            border: 2px solid var(--teal-light);
            border-radius: 25px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .square-card:hover {
            border-color: var(--teal-medium);
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 121, 107, 0.1);
        }
