<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Methods</title>
    <style>
        :root {
            --teal-bg: #e0f2f1;
            --teal-btn: #4db6ac;
            --teal-text: #00796b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--teal-bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 100px 20px 40px 20px;
            box-sizing: border-box;
        }

        /* Title: Static to the top of the page and Black */
        .page-title {
            position: absolute;
            top: 25px;
            left: 25px;
            font-size: 1.6rem;
            color: #000000;
            font-weight: 800;
            margin: 0;
        }

        /* Main White Container */
        .main-card {
            background: white;
            padding: 50px;
            border-radius: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        /* Grid for the 6 Methods */
        .method-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .method-box {
            background: #ffffff;
            border: 2px solid #f2f2f2;
            border-radius: 30px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s, border-color 0.3s;
            padding: 10px;
        }

        .method-box:hover {
            border-color: var(--teal-btn);
            transform: translateY(-8px);
            background-color: #fafafa;
        }

        .emoji {
            font-size: 3.5rem;
            margin-bottom: 12px;
        }

        .label {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--teal-text);
        }

        /* Timer UI */
        #timer-view { display: none; }
        
        #display {
            font-size: 7rem;
            font-weight: 200;
            color: var(--teal-text);
            margin: 30px 0;
        }

        .btn {
            background: var(--teal-btn);
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 40px;
            color: #999;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: underline;
        }

        @media (max-width: 850px) {
            .method-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 500px) {
            .method-grid { grid-template-columns: 1fr; }
            .page-title { left: 50%; transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <h1 class="page-title">StudyMethods</h1>

    <div class="main-card">
        <div id="selection-view">
            <div class="method-grid">
                <div class="method-box" onclick="start(25, 'Pomodoro')">
                    <span class="emoji">🍅</span>
                    <span class="label">Pomodoro</span>
                </div>
                <div class="method-box" onclick="start(50, '50/10 Rule')">
                    <span class="emoji">⏱️</span>
                    <span class="label">50/10 Rule</span>
                </div>
                <div class="method-box" onclick="start(20, 'Feynman')">
                    <span class="emoji">👨‍🏫</span>
                    <span class="label">Feynman</span>
                </div>
                <div class="method-box" onclick="start(15, 'Active Recall')">
                    <span class="emoji">🧠</span>
                    <span class="label">Active Recall</span>
                </div>
                <div class="method-box" onclick="start(45, 'Eat The Frog')">
                    <span class="emoji">🐸</span>
                    <span class="label">Eat The Frog</span>
                </div>
                <div class="method-box" onclick="start(30, 'SQ3R Method')">
                    <span class="emoji">🔍</span>
                    <span class="label">SQ3R Method</span>
                </div>
            </div>
        </div>

        <div id="timer-view">
            <h2 id="mode-name" style="color: var(--teal-text); font-size: 1.8rem;">Method</h2>
            <div id="display">00:00</div>
            <button id="run-btn" class="btn" onclick="toggle()">Start</button>
            <span class="back" onclick="goBack()">← Back to Methods</span>
        </div>
    </div>

    <script>
        let time;
        let timer = null;
        let running = false;

        function start(mins, name) {
            document.getElementById('selection-view').style.display = 'none';
            document.getElementById('timer-view').style.display = 'block';
            document.getElementById('mode-name').innerText = name;
            time = mins * 60;
            showTime();
            window.scrollTo(0,0);
        }

        function showTime() {
            let m = Math.floor(time / 60);
            let s = time % 60;
            document.getElementById('display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function toggle() {
            if (!running) {
                running = true;
                document.getElementById('run-btn').innerText = "Pause";
                timer = setInterval(() => {
                    time--;
                    showTime();
                    if (time <= 0) {
                        clearInterval(timer);
                        alert("Session Complete!");
                        goBack();
                    }
                }, 1000);
            } else {
                running = false;
                document.getElementById('run-btn').innerText = "Resume";
                clearInterval(timer);
            }
        }

        function goBack() {
            clearInterval(timer);
            running = false;
            document.getElementById('run-btn').innerText = "Start";
            document.getElementById('selection-view').style.display = 'block';
            document.getElementById('timer-view').style.display = 'none';
        }
    </script>
</body>
</html>
